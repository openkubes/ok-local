apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ok-registry

resources:
  - gitops/namespace.yaml

helmCharts:
  - name: zot
    repo: https://zotregistry.dev/helm-charts
    version: 0.1.122
    releaseName: zot
    namespace: ok-registry
    valuesFile: compositions/zot/values-local.yaml

# GitOps never stores the probe credential. TCP probes retain health checking
# while the separately provisioned zot-htpasswd Secret protects HTTP APIs.
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: zot
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe
        value:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
