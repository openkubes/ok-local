<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">Read-only diagnostics security boundary</title>
  <desc id="desc">Only the diagnostics tool service has a Kubernetes identity; all upstream components have no Kubernetes credentials.</desc>
  <defs><style>.title{font:700 24px Arial,sans-serif;fill:#172b4d}.panel{fill:#f4f5f7;stroke:#8993a4;stroke-width:2}.safe{fill:#e3fcef;stroke:#00875a;stroke-width:2}.deny{fill:#ffebe6;stroke:#de350b;stroke-width:2}.head{font:700 20px Arial,sans-serif;fill:#172b4d}.label{font:700 16px Arial,sans-serif;fill:#172b4d}.small{font:15px Arial,sans-serif;fill:#42526e}.yes{fill:#00875a}.no{fill:#de350b}</style></defs>
  <rect width="1280" height="500" fill="#fff"/>
  <text x="640" y="40" text-anchor="middle" class="title">Security Is Enforced at the Kubernetes Tool Boundary</text>
  <rect x="42" y="82" width="560" height="338" rx="18" class="panel"/>
  <text x="322" y="124" text-anchor="middle" class="head">No Kubernetes credential</text>
  <text x="88" y="174" class="label">Open WebUI</text><text x="88" y="202" class="small">User authentication only</text>
  <text x="88" y="250" class="label">OpenClaw</text><text x="88" y="278" class="small">Gateway token; three allowlisted functions</text>
  <text x="88" y="326" class="label">MCP adapter + facade + kagent agents</text><text x="88" y="354" class="small">No general Kubernetes API token or kubectl</text>
  <circle cx="550" cy="177" r="14" class="no"/><text x="550" y="183" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#fff">×</text>
  <circle cx="550" cy="253" r="14" class="no"/><text x="550" y="259" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#fff">×</text>
  <circle cx="550" cy="329" r="14" class="no"/><text x="550" y="335" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#fff">×</text>
  <rect x="638" y="82" width="600" height="208" rx="18" class="safe"/>
  <text x="938" y="124" text-anchor="middle" class="head">Scoped Kubernetes identity</text>
  <text x="684" y="172" class="label">platform-diagnostics-tools</text>
  <text x="684" y="210" class="small">Allowed: get · list · watch on selected resources</text>
  <text x="684" y="246" class="small">Identity: dedicated ServiceAccount</text>
  <circle cx="1182" cy="180" r="14" class="yes"/><text x="1182" y="186" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#fff">✓</text>
  <rect x="638" y="312" width="600" height="108" rx="18" class="deny"/>
  <text x="684" y="354" class="label">Explicitly denied</text>
  <text x="684" y="390" class="small">Secrets · create · update · patch · delete · wildcard permissions</text>
  <text x="640" y="464" text-anchor="middle" class="small">Prompts explain intent. ServiceAccounts, RBAC, and token mounts enforce the boundary.</text>
</svg>
