apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-diagnostics
  namespace: platform-diagnostics
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: platform-diagnostics-facade }
  template:
    metadata:
      labels: { app.kubernetes.io/name: platform-diagnostics-facade }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: facade
          image: ghcr.io/openkubes/platform-diagnostics-facade:0.1.7@sha256:9babaeb0ebaf49c281d31b9aa184de821d7d0c64d8c60e50a8564e0da94a0cf3
          env:
            # The Go agent serves JSON-RPC on every path used by the legacy
            # facade. Calling it directly avoids the 180-second controller
            # proxy deadline, which is shorter than local CPU inference.
            - { name: KAGENT_BASE_URL, value: "http://openkubes-platform-agent.platform-diagnostics.svc.cluster.local:8080" }
            - { name: KAGENT_NAMESPACE, value: platform-diagnostics }
            - { name: KAGENT_AGENT, value: openkubes-platform-agent }
            - { name: KAGENT_TOOLS_URL, value: "http://platform-diagnostics-tools.platform-diagnostics.svc.cluster.local:8084/mcp" }
            - { name: AGENT_TIMEOUT_SECONDS, value: "900" }
            - { name: DEFAULT_CLUSTER, value: ok-infra-local }
            - { name: PROVIDER_CAPS, value: '{"workload_events":true,"workload_logs":true,"cilium_diagnostics":false,"host_journal":false,"node_shell":false}' }
          ports: [{ name: http, containerPort: 8080 }]
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          readinessProbe: { httpGet: { path: /readyz, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: platform-diagnostics
  namespace: platform-diagnostics
spec:
  selector: { app.kubernetes.io/name: platform-diagnostics-facade }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-diagnostics-mcp-adapter
  namespace: platform-diagnostics
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: platform-diagnostics-mcp-adapter }
  template:
    metadata:
      labels: { app.kubernetes.io/name: platform-diagnostics-mcp-adapter }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: adapter
          image: ghcr.io/openkubes/platform-diagnostics-mcp-adapter:0.1.0@sha256:a291bc1706a630c0b5c2452fd940440fb7e8b895bcc9582148f723dc07dd7029
          env:
            - { name: FACADE_URL, value: "http://platform-diagnostics.platform-diagnostics.svc.cluster.local:8080" }
            - { name: FACADE_TIMEOUT_SECONDS, value: "900" }
          ports: [{ name: mcp, containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: mcp } }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: platform-diagnostics-mcp
  namespace: platform-diagnostics
spec:
  selector: { app.kubernetes.io/name: platform-diagnostics-mcp-adapter }
  ports: [{ name: mcp, port: 8080, targetPort: mcp }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-diagnostics-mcp-adapter
  namespace: platform-diagnostics
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: platform-diagnostics-mcp-adapter }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { openkubes.io/diagnostics-consumer: "true" }
      ports: [{ protocol: TCP, port: 8080 }]
