apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: observability-agent
  namespace: platform-diagnostics
  labels: { platform.openkubes.ai/role: specialist }
spec:
  description: Read-only Kubernetes log and event correlation.
  type: Declarative
  declarative:
    modelConfig: ollama-qwen3-4b
    runtime: go
    a2aConfig: {}
    deployment:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
    systemMessage: |
      Read-only observability specialist. Correlate logs and events within the
      requested time range. Return evidence references, not raw secret-bearing
      payloads. Report unavailable sources and never mutate resources.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: platform-diagnostics-tools
          toolNames:
            - k8s_get_pod_logs
            - k8s_get_events
            - k8s_get_resources
